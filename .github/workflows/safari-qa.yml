name: Safari regression QA

on:
  push:
    branches: [agent/safari-validation-20261027]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    name: Safari (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            label: macos
            runner: macos-15
          - platform: ios
            label: ios-26.2
            runtime: '26.2'
            runner: macos-15
          - platform: ios
            label: ios-18.5
            runtime: '18.5'
            runner: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare native Safari
        env:
          QA_PLATFORM: ${{ matrix.platform }}
          QA_IOS_RUNTIME: ${{ matrix.runtime }}
        run: |
          mkdir -p safari-results
          sw_vers | tee safari-results/macos.txt
          /usr/bin/safaridriver --version | tee safari-results/safaridriver-version.txt
          sudo /usr/bin/safaridriver --enable
          defaults read com.apple.universalaccess reduceMotion || true
          defaults read com.apple.Accessibility ReduceMotionEnabled || true
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.Accessibility ReduceMotionEnabled -bool false
          python3 tests/prepare-safari.py
      - name: Test production site
        env:
          QA_PLATFORM: ${{ matrix.platform }}
          QA_BASE_URL: https://kazma.ge
        run: |
          /usr/bin/safaridriver --port 4444 > safari-results/driver.log 2>&1 &
          python3 tests/safari-qa.py
      - name: Upload results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safari-${{ matrix.label }}
          path: safari-results/
          retention-days: 14
