<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Stage 2 responsive review</title><style>body{margin:0;background:#dedede;font:14px system-ui;color:#111}header{position:sticky;top:0;z-index:2;background:#fff;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}button{padding:9px 14px;cursor:pointer}iframe{display:block;margin:20px auto;border:1px solid #aaa;width:375px;height:812px;background:#070707;max-width:100%}output{margin-left:10px}</style><header><strong>Stage 2 review</strong><button data-page="/portfolio">Portfolio</button><button data-page="/about">About</button><button data-width="320">320px</button><button data-width="375">375px</button><button data-width="768">768px</button><button data-width="1024">1024px</button><button id="full">Full page</button><button id="screen">Screen height</button><output id="status">375px · Portfolio</output></header><iframe title="Website responsive preview" src="/portfolio"></iframe><script>const frame=document.querySelector('iframe');let width=375,page='Portfolio';const status=document.querySelector('#status');function label(){status.textContent=width+'px · '+page}document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{width=Number(button.dataset.width);frame.style.width=width+'px';frame.style.height='812px';label()});document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{page=button.textContent;frame.src=button.dataset.page;frame.style.height='812px';label()});document.querySelector('#full').onclick=()=>frame.style.height=frame.contentDocument.documentElement.scrollHeight+'px';document.querySelector('#screen').onclick=()=>frame.style.height='812px';</script></html>
