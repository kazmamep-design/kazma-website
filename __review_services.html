<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Services responsive review</title><style>body{margin:0;background:#dedede;font:14px system-ui;color:#111}header{position:sticky;top:0;z-index:2;background:#fff;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}button{padding:9px 14px;cursor:pointer}iframe{display:block;margin:20px auto;border:1px solid #aaa;width:375px;height:812px;background:#070707;max-width:100%}</style><header><strong>Services review</strong><button data-width="320">320px</button><button data-width="375">375px</button><button data-width="768">768px</button><button data-width="1024">1024px</button><button id="full">Full page</button><button id="screen">Screen height</button><output id="status">375px</output></header><iframe title="Services responsive preview" src="/services"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{frame.style.width=button.dataset.width+'px';frame.style.height='812px';document.querySelector('#status').textContent=button.dataset.width+'px'});document.querySelector('#full').onclick=()=>frame.style.height=frame.contentDocument.documentElement.scrollHeight+'px';document.querySelector('#screen').onclick=()=>frame.style.height='812px';</script></html>
